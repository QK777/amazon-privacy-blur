<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Amazon マスク</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Amazon マスク</h1>
  <button id="enabled" type="button" aria-pressed="true" aria-label="名前・住所の保護をオフにする" disabled>
    <span class="eye-icon" aria-hidden="true">
      <svg class="eye-open" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-closed" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 5.1A12 12 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.1 6.1A20 20 0 0 0 2 12s3.5 7 10 7a12 12 0 0 0 5-1.2M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
    </span>
    <span><strong id="enabled-label">保護オン</strong><span id="enabled-hint">名前・住所を隠しています</span></span>
  </button>
  <p>注文履歴・注文詳細のお届け先、住所帳などの対応する名前・住所欄を、登録なしで自動的に隠します。</p>
  <label for="mode">隠し方</label>
  <select id="mode"><option value="stars">* で隠す（標準）</option><option value="blur">ぼかし</option></select>
  <details><summary>その他の文字列も隠す（任意）</summary>
  <label class="postal-option"><input id="scan-postal" type="checkbox"> 本文全体の郵便番号も検索する</label>
  <small>通常はオフで軽く動作します。名前・住所欄はこの設定に関係なく隠れます。</small>
  <label for="names">補助的に隠す文字列（1行に1つ）</label>
  <textarea id="names" rows="4" placeholder="山田 太郎&#10;山田太郎"></textarea>
  <p>欄以外の文字も隠したい場合だけ登録してください。本文検索を使う場合は追加の走査・監視が動作します。</p>
  <button id="save">保存する</button></details><p id="status" role="status"></p>
  <small>表示だけを加工します。個人情報の外部送信はありません。共有前に隠れていることを確認してください。</small>
  <script src="popup.js"></script>
</body></html>
